# Source of Pibbles.xcodeproj: edit this file and run `xcodegen` in iOS/.
name: Pibbles
options:
  bundleIdPrefix: app.pibbles
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Same team as Hoeveelishet, for installing on a real iPhone
    DEVELOPMENT_TEAM: 65FAHRU88M
    CODE_SIGN_STYLE: Automatic
packages:
  PibblesCore:
    path: ../Packages/PibblesCore
  PibblesUI:
    path: ../Packages/PibblesUI
targets:
  Pibbles:
    type: application
    platform: iOS
    sources:
      - Pibbles
    dependencies:
      - package: PibblesCore
      - package: PibblesUI
    info:
      path: Pibbles/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Pibbles"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pibbles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
